name: Diagnose Hostinger site

# Read-only health report: HTTP status from outside, then files, permissions,
# PHP versions and recent errors on the server (deploy/diagnose.sh).
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to check
        required: true
        default: golden-slt.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '147.93.99.208' }}
      SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
      SSH_USER: ${{ vars.SSH_USER || 'u991773587' }}
      DOMAIN: ${{ inputs.domain }}
    steps:
      - uses: actions/checkout@v4

      - name: From outside
        run: |
          for path in / /robots.txt /prices /api/v1/prices; do
            echo "===== https://$DOMAIN$path"
            curl -sS -o body.txt -D headers.txt -w 'status %{http_code}\n' --max-time 30 "https://$DOMAIN$path" || true
            head -15 headers.txt
            head -c 600 body.txt | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 400; echo
          done

      - name: On the server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DOMAIN=$(printf '%q' "$DOMAIN") bash -s" < deploy/diagnose.sh
