<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التطبيق — بيع ذهب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6A1F}a:hover{color:#5E4712}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F2EE; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1712; font-variant-numeric: tabular-nums">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 96px; overflow-y: auto; padding: 16px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="AppWallet.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<b style="font-size: 18px">بيع ذهب</b>
<span style="width: 44px"></span>
</div>

<div style="background: #12100C; color: #F4F2EE; border-radius: 20px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #A39A88">متاح للبيع</span><b style="font-size: 22px">12.450 <span style="font-size: 13px; color: #C8A04B">جم عيار 24</span></b></span>
<span style="display: flex; flex-direction: column; gap: 2px; text-align: end"><span style="font-size: 13px; color: #A39A88">نشتري منك</span><b style="font-size: 18px">6,190 <span style="font-size: 12px; color: #A39A88">ج.م/جم</span></b></span>
</div>

<div style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="font-size: 13px; color: #5E584E">الكمية اللي هتبيعها</span>
<b style="font-size: 44px; letter-spacing: -1px">{{gramsTxt}} جم</b>
<span style="font-size: 15px; color: #8A6A1F; font-weight: 600">≈ {{valueTxt}} ج.م</span>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; padding: 0 0 8px">الفلوس توصلك إزاي؟</legend>
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}"><span style="display: flex; flex-direction: column; gap: 2px; text-align: start"><b style="font-size: 15px">{{m.label}}</b><span style="font-size: 12px; color: #5E584E">{{m.hint}}</span></span><span style="{{m.dot}}"></span></button>
</sc-for>
</fieldset>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<div style="display: flex; justify-content: space-between"><span style="color: #5E584E">قيمة البيع</span><b>{{valueTxt}} ج.م</b></div>
<div style="display: flex; justify-content: space-between"><span style="color: #5E584E">رسوم التحويل</span><b>[حسب الطريقة]</b></div>
<div style="height: 1px; background: #E4DFD6"></div>
<div style="display: flex; justify-content: space-between; font-size: 16px"><b>هتستلم</b><b style="color: #8A6A1F">≈ {{valueTxt}} ج.م</b></div>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #FFFFFF; border-top: 1px solid #E4DFD6; padding: 16px 20px; box-sizing: border-box">
<a href="AppWallet.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #12100C; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 17px">تأكيد بيع {{gramsTxt}} جم</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { grams: 2.5, method: 'instapay' };
  }
  renderVals() {
    const s = this.state;
    const all = 12.45;
    const fmt = (n) => Math.round(n).toLocaleString('en-US');
    const chipBase = 'min-height: 44px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;';
    const chips = [{ g: 1, label: '1 جم' }, { g: 2.5, label: '2.5 جم' }, { g: 5, label: '5 جم' }, { g: all, label: 'الكل' }].map((c) => ({
      label: c.label,
      pick: () => this.setState({ grams: c.g }),
      style: chipBase + (s.grams === c.g ? ' background: #C8A04B; color: #12100C; border: 1px solid #C8A04B;' : ' background: #FFFFFF; color: #1A1712; border: 1px solid #E4DFD6;')
    }));
    const methods = [
      { id: 'instapay', label: 'إنستاباي', hint: 'فوري في أغلب الأحوال' },
      { id: 'bank', label: 'حساب بنكي', hint: 'خلال [مدة التحويل]' },
      { id: 'wallet', label: 'محفظة موبايل', hint: 'على رقمك المسجّل' },
      { id: 'branch', label: 'كاش من الفرع', hint: 'بمعاد تحجزه' }
    ].map((m) => {
      const on = s.method === m.id;
      return {
        ...m, on: on ? 'true' : 'false',
        pick: () => this.setState({ method: m.id }),
        style: 'display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding: 10px 16px; border-radius: 16px; font: inherit; color: #1A1712; cursor: pointer; background: #FFFFFF; border: 2px solid ' + (on ? '#12100C' : '#E4DFD6') + ';',
        dot: 'width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; flex: none; border: ' + (on ? '6px solid #12100C' : '2px solid #D6CFC2') + ';'
      };
    });
    return {
      chips, methods,
      gramsTxt: s.grams === all ? '12.450' : String(s.grams),
      valueTxt: fmt(s.grams * 6190)
    };
  }
}
</script>
</body>
</html>
