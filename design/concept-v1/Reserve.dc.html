<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التطبيق — حجز القطعة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6A1F}a:hover{color:#5E4712}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F2EE; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1712; font-variant-numeric: tabular-nums">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 96px; overflow-y: auto; padding: 16px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="AppProduct.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<b style="font-size: 18px">حجز القطعة</b>
<span style="width: 44px"></span>
</div>

<div style="background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; gap: 12px; align-items: center">
<span style="width: 72px; height: 72px; border-radius: 14px; background: #ECE7DE; display: flex; align-items: center; justify-content: center; flex: none"><svg width="48" height="48" viewBox="0 0 64 64" fill="none" stroke="#B8913E" stroke-width="1.6" aria-hidden="true"><path d="M12 14c2 18 10 28 20 28s18-10 20-28"></path><path d="M32 42v4"></path><path d="M32 46l-5 6 5 6 5-6z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px">سلسلة مبرومة بدلاية</b><span style="font-size: 13px; color: #5E584E">عيار 21 · 7.2 جم</span><b style="font-size: 15px; color: #8A6A1F">≈ 41,800 ج.م</b></span>
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; padding: 0 0 8px">الفرع</legend>
<sc-for list="{{branches}}" as="b" hint-placeholder-count="2">
<button type="button" onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="{{b.style}}"><span style="display: flex; flex-direction: column; gap: 2px; text-align: start"><b style="font-size: 15px">{{b.label}}</b><span style="font-size: 12px; color: #1F7A4D; font-weight: 600">{{b.hint}}</span></span><span style="{{b.dot}}"></span></button>
</sc-for>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; padding: 0 0 8px">هتدفع إزاي؟</legend>
<sc-for list="{{pays}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}"><span style="display: flex; flex-direction: column; gap: 2px; text-align: start"><b style="font-size: 15px">{{p.label}}</b><span style="font-size: 12px; color: #5E584E; line-height: 1.5">{{p.hint}}</span></span><span style="{{p.dot}}"></span></button>
</sc-for>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">معاد الزيارة</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{slots}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<div style="display: flex; justify-content: space-between"><span style="color: #5E584E">{{line1Label}}</span><b>{{line1}}</b></div>
<div style="display: flex; justify-content: space-between"><span style="color: #5E584E">{{line2Label}}</span><b>{{line2}}</b></div>
</div>
<span style="font-size: 12px; color: #5E584E; line-height: 1.7">القطعة هتفضل محجوزة باسمك [مدة الحجز]. السعر النهائي بسعر الذهب وقت الاستلام.</span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #FFFFFF; border-top: 1px solid #E4DFD6; padding: 16px 20px; box-sizing: border-box">
<a href="ReserveDone.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #12100C; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 17px">تأكيد الحجز</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { branch: 0, pay: 'deposit', slot: 1 };
  }
  renderVals() {
    const s = this.state;
    const radio = (on) => 'display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 10px 16px; border-radius: 16px; font: inherit; color: #1A1712; cursor: pointer; background: ' + (on ? '#FFFFFF' : '#FFFFFF') + '; border: 2px solid ' + (on ? '#12100C' : '#E4DFD6') + ';';
    const dot = (on) => 'width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; flex: none; border: ' + (on ? '6px solid #12100C' : '2px solid #D6CFC2') + ';';
    const chip = 'min-height: 48px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;';
    const lines = {
      deposit: ['عربون دلوقتي', '[قيمة العربون]', 'الباقي في الفرع', '≈ 41,800 ج.م − العربون'],
      branch: ['تدفع في الفرع', '≈ 41,800 ج.م', 'دلوقتي', '0 ج.م']
    }[s.pay];
    return {
      branches: [{ l: 'فرع [١] — [المنطقة]', h: 'متوفر · 2 قطعة' }, { l: 'فرع [٢] — [المنطقة]', h: 'متوفر · قطعة واحدة' }].map((b, i) => ({
        label: b.l, hint: b.h, on: s.branch === i ? 'true' : 'false', pick: () => this.setState({ branch: i }), style: radio(s.branch === i), dot: dot(s.branch === i)
      })),
      pays: [
        { id: 'deposit', label: 'عربون والباقي في الفرع', hint: 'ادفع [قيمة العربون] أونلاين دلوقتي' },
        { id: 'branch', label: 'ادفع كامل في الفرع', hint: 'كاش أو كارت وقت الاستلام' }
      ].map((p) => ({ ...p, on: s.pay === p.id ? 'true' : 'false', pick: () => this.setState({ pay: p.id }), style: radio(s.pay === p.id), dot: dot(s.pay === p.id) })),
      slots: ['النهارده · 7 م', 'بكرة · 1 ظ', 'بكرة · 6 م'].map((l, i) => ({
        label: l, pick: () => this.setState({ slot: i }),
        style: chip + (s.slot === i ? ' background: #C8A04B; color: #12100C; border: 1px solid #C8A04B;' : ' background: #FFFFFF; color: #1A1712; border: 1px solid #E4DFD6;')
      })),
      line1Label: lines[0], line1: lines[1], line2Label: lines[2], line2: lines[3]
    };
  }
}
</script>
</body>
</html>
