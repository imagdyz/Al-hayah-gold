<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الحياة جولد — اللوجو</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="{{rootStyle}}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 48 48" fill="none" stroke="{{markColor}}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><rect x="11" y="11" width="26" height="26"></rect><rect x="11" y="11" width="26" height="26" transform="rotate(45 24 24)"></rect><circle cx="24" cy="24" r="5.5"></circle></svg>
<sc-if value="{{showText}}" hint-placeholder-val="{{ true }}">
<span style="{{textStyle}}"><span style="{{nameStyle}}">الحياة جولد</span><span dir="ltr" style="{{latinStyle}}">AL HAYAH GOLD</span></span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":40,"min":16,"max":240},"tone":{"editor":"enum","default":"onLight","options":["onLight","onDark","onGold"]},"layout":{"editor":"enum","default":"horizontal","options":["horizontal","stacked","mark"]},"$preview":{"width":200,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 40);
    const tone = this.props.tone ?? 'onLight';
    const layout = this.props.layout ?? 'horizontal';
    const tones = {
      onLight: { mark: '#8A6A1F', name: '#12100C', latin: '#6B6458' },
      onDark: { mark: '#C8A04B', name: '#F4F2EE', latin: '#C8A04B' },
      onGold: { mark: '#12100C', name: '#12100C', latin: '#12100C' }
    };
    const t = tones[tone] || tones.onLight;
    const stacked = layout === 'stacked';
    const px = (n) => Math.round(n * 10) / 10 + 'px';
    const nameSize = stacked ? size * 0.375 : size * 0.6;
    const latinSize = Math.max(stacked ? size * 0.1 : size * 0.25, 9);
    return {
      size,
      markColor: t.mark,
      showText: layout !== 'mark',
      rootStyle: 'display: inline-flex; align-items: center; font-family: \'IBM Plex Sans Arabic\', sans-serif; color: ' + t.name + '; flex-direction: ' + (stacked ? 'column' : 'row') + '; gap: ' + px(size * (stacked ? 0.17 : 0.25)) + ';',
      textStyle: 'display: flex; flex-direction: column; line-height: 1.1; align-items: ' + (stacked ? 'center' : 'flex-start') + '; gap: ' + px(stacked ? size * 0.07 : size * 0.04) + ';',
      nameStyle: 'font-family: \'El Messiri\', serif; font-weight: 700; white-space: nowrap; font-size: ' + px(nameSize) + '; color: ' + t.name + ';',
      latinStyle: 'white-space: nowrap; font-weight: 600; font-size: ' + px(latinSize) + '; letter-spacing: ' + px(latinSize * (stacked ? 0.55 : 0.3)) + '; color: ' + t.latin + ';'
    };
  }
}
</script>
</body>
</html>
