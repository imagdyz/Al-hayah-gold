<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التطبيق — طلباتي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6A1F}a:hover{color:#5E4712}
button:focus-visible,a:focus-visible{outline:2px solid #C8A04B;outline-offset:2px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EE; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1712; font-variant-numeric: tabular-nums">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 20px 20px 108px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-family: 'El Messiri', serif; font-size: 30px; font-weight: 700">طلباتي</h1><span style="font-size: 13px; color: #5E584E">سبائك، حجوزات مجوهرات، ومعادات بيع</span></div>

<div style="display: flex; gap: 6px; background: #ECE5D8; border-radius: 999px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #ECE5D8; border-radius: 24px; overflow: hidden; box-shadow: 0 14px 30px -26px rgba(60,44,12,.6)">
<button type="button" onClick="{{o.toggle}}" aria-expanded="{{o.expanded}}" style="width: 100%; display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: transparent; border: none; font: inherit; color: #1A1712; text-align: start; cursor: pointer">
<span style="flex: none; width: 64px; height: 64px; border-radius: 16px; background: radial-gradient(circle at 50% 40%, #FFFFFF, #EFE7D8); display: flex; align-items: center; justify-content: center"><img src="{{o.img}}" alt="" style="width: 56px; height: 56px; object-fit: contain"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="{{o.pillStyle}}">{{o.status}}</span>
<b style="font-size: 15px">{{o.title}}</b>
<span style="font-size: 12px; color: #5E584E">{{o.meta}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.chevron}}"></path></svg>
</button>
<sc-if value="{{o.open}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px dashed #E6DECF; padding: 14px; display: flex; gap: 14px; align-items: center">
<svg width="92" height="92" viewBox="0 0 21 21" role="img" aria-label="كود QR (توضيحي)" style="flex: none; shape-rendering: crispEdges"><rect width="21" height="21" fill="#FFFFFF"></rect><g fill="#12100C"><path d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z"></path></g><g fill="#FFFFFF"><path d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"></path></g><g fill="#12100C"><path d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2zM8 1h1v2H8zM10 0h2v1h-2zM9 4h2v2H9zM12 3h1v3h-1zM8 8h3v1H8zM13 8h2v2h-2zM18 9h3v1h-3zM0 9h2v1H0zM3 8h2v2H3zM9 10h1v3H9zM11 11h3v1h-3zM15 11h2v2h-2zM8 14h2v1H8zM11 13h1v3h-1zM13 14h3v1h-3zM17 15h2v2h-2zM8 17h3v1H8zM12 18h2v3h-2zM15 17h1v2h-1zM17 19h4v1h-4zM20 15h1v3h-1z"></path></g></svg>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.6">
<span style="color: #5E584E">كود الطلب</span>
<b style="font-size: 20px; letter-spacing: .05em" dir="ltr">{{o.code}}</b>
<span>{{o.detail}}</span>
<a href="AppBranches.dc.html" style="font-weight: 600">الاتجاهات للفرع ←</a>
</div>
</div>
</sc-if>
</div>
</sc-for>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 20px; text-align: center; color: #5E584E; display: flex; flex-direction: column; gap: 10px; align-items: center"><b style="color: #1A1712">مفيش طلبات قديمة لسه</b><span style="font-size: 14px">أول ما تستلم طلب هيظهر هنا.</span></div>
</sc-if>
</div>

<nav aria-label="التنقل الرئيسي" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(255,255,255,.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid rgba(214,207,194,.7); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
<a href="AppHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>الرئيسية</a>
<a href="AppShop.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l3 6-9 12L3 9z"></path><path d="M3 9h18"></path></svg>المجوهرات</a>
<a href="AppBuy.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; text-decoration: none; color: #1A1712; font-size: 11px; font-weight: 700; margin-top: -28px"><span style="width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(180deg, #EACD80 0%, #C8A04B 55%, #AE8834 100%); border: 4px solid #F6F3EE; box-shadow: 0 10px 22px -8px rgba(168,133,58,.9), inset 0 1px 0 rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12100C" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l3-9h10l3 9z"></path><path d="M9 13h6"></path></svg></span>اطلب سبيكة</a>
<a href="AppOrders.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #8A6A1F; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>طلباتي</a>
<a href="AppBranches.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>الفروع</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'now', open: 'AH-2481' };
  }
  renderVals() {
    const s = this.state;
    const B = '/_blob/';
    const pill = (bg, fg) => 'align-self: flex-start; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: ' + bg + '; color: ' + fg;
    const all = [
      { code: 'AH-2481', tab: 'now', title: 'سبيكة 10 جم', meta: 'فرع [١] · سعر مثبّت 63,100 ج.م', status: 'جاهز للاستلام', pillStyle: pill('#E3F2E9', '#1F7A4D'), detail: 'الدفع في الفرع · ثابت لحد [التاريخ]', img: B + 'aa6953e04c8669db91470f39301e624e' },
      { code: 'AH-2475', tab: 'now', title: 'حجز سلسلة مبرومة بدلاية', meta: 'فرع [٢] · محجوزة لحد [التاريخ]', status: 'محجوزة لك', pillStyle: pill('#FFF1D6', '#5C3D00'), detail: 'هتشوفها قبل ما تدفع', img: B + 'dbac027a2563d3d060bfab8971cfc70a' },
      { code: 'AH-2470', tab: 'now', title: 'معاد بيع ذهب', meta: 'فرع [١] · بكرة 12 ظ', status: 'معاد مؤكد', pillStyle: pill('#ECE5D8', '#3F3524'), detail: 'عيار 21 · حوالي 12 جم', img: B + 'edccb29f110a4f2979286cee57c7fee2' },
      { code: 'AH-2398', tab: 'past', title: 'جنيه ذهب × 2', meta: 'فرع [٣] · [التاريخ]', status: 'تم الاستلام', pillStyle: pill('#F1ECE3', '#5E584E'), detail: 'الفاتورة في الإيميل', img: B + '401f751c774d701b5cad69baa1026632' }
    ];
    const segBase = 'flex: 1; min-height: 42px; border: none; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;';
    const tabs = [{ id: 'now', label: 'الحالية' }, { id: 'past', label: 'السابقة' }].map((t) => ({
      label: t.label,
      pick: () => this.setState({ tab: t.id }),
      style: segBase + (s.tab === t.id ? ' background: #FFFFFF; color: #12100C; box-shadow: 0 2px 6px rgba(18,16,12,.1);' : ' background: transparent; color: #5E584E;')
    }));
    const orders = all.filter((o) => o.tab === s.tab).map((o) => {
      const open = s.open === o.code;
      return Object.assign({}, o, {
        open,
        expanded: open ? 'true' : 'false',
        chevron: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
        toggle: () => this.setState({ open: open ? '' : o.code })
      });
    });
    return { tabs, orders, empty: orders.length === 0 };
  }
}
</script>
</body>
</html>
