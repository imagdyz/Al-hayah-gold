<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التطبيق — المجوهرات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6A1F}a:hover{color:#5E4712}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EE; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1712; font-variant-numeric: tabular-nums">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 20px 20px 108px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-family: 'El Messiri', serif; font-size: 30px; font-weight: 700">المجوهرات</h1><span style="font-size: 13px; color: #5E584E">{{count}} قطعة موجودة دلوقتي في الفروع</span></div>
<button type="button" aria-label="المفضلة" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E6DECF; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"></path></svg></button>
</div>

<div style="display: flex; gap: 10px">
<div style="flex: 1; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #ECE5D8; border-radius: 16px; padding: 0 14px; min-height: 50px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E584E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="shop-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ابحث في المجوهرات</label>
<input id="shop-q" type="search" placeholder="ابحث: خاتم، سلسلة، دبلة…" style="flex: 1; border: none; outline: none; font: inherit; font-size: 15px; background: transparent; min-height: 44px; color: #1A1712">
</div>
<button type="button" aria-label="الفلاتر" style="width: 50px; height: 50px; border-radius: 16px; background: #12100C; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E6C77A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
</div>

<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<button type="button" style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #ECE5D8; border-radius: 14px; padding: 0 14px; font: inherit; font-size: 14px; color: #1A1712; cursor: pointer; min-height: 46px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
<span>متوفر في: <b>كل الفروع</b></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1712" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="margin-inline-start: auto"><path d="M6 9l6 6 6-6"></path></svg>
</button>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="6">
<a href="AppProduct.dc.html" style="text-decoration: none; color: #1A1712; display: flex; flex-direction: column; gap: 6px">
<span style="height: 196px; border-radius: 22px; background: radial-gradient(circle at 50% 40%, #FFFFFF 0%, #F2ECE1 62%, #E7DECD 100%); display: flex; align-items: center; justify-content: center; position: relative">
<img src="{{p.img}}" alt="{{p.alt}}" style="width: 138px; height: 138px; object-fit: contain">
<span style="position: absolute; top: 10px; inset-inline-start: 10px; font-size: 11px; font-weight: 700; color: #E6C77A; background: #12100C; border-radius: 999px; padding: 3px 8px">{{p.karat}}</span>
<span style="position: absolute; bottom: 10px; inset-inline-start: 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #1F7A4D; background: rgba(255,255,255,.88); border-radius: 999px; padding: 3px 8px"><span style="width: 5px; height: 5px; border-radius: 50%; background: #1F7A4D; display: inline-block"></span>{{p.stock}}</span>
</span>
<b style="font-size: 14px; padding: 0 2px">{{p.name}}</b>
<span style="font-size: 12px; color: #5E584E; padding: 0 2px">{{p.weight}}</span>
<b style="font-size: 15px; color: #8A6A1F; padding: 0 2px">≈ {{p.price}} ج.م</b>
</a>
</sc-for>
</div>
</div>

<nav aria-label="التنقل الرئيسي" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(255,255,255,.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid rgba(214,207,194,.7); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
<a href="AppHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>الرئيسية</a>
<a href="AppShop.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #8A6A1F; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l3 6-9 12L3 9z"></path><path d="M3 9h18"></path></svg>المجوهرات</a>
<a href="AppBuy.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; text-decoration: none; color: #1A1712; font-size: 11px; font-weight: 700; margin-top: -28px"><span style="width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(180deg, #EACD80 0%, #C8A04B 55%, #AE8834 100%); border: 4px solid #F6F3EE; box-shadow: 0 10px 22px -8px rgba(168,133,58,.9), inset 0 1px 0 rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12100C" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l3-9h10l3 9z"></path><path d="M9 13h6"></path></svg></span>اطلب سبيكة</a>
<a href="AppOrders.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>طلباتي</a>
<a href="AppBranches.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>الفروع</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all' };
  }
  renderVals() {
    const B = '/_blob/';
    const all = [
      { name: 'سلسلة مبرومة بدلاية', karat: 'عيار 21', weight: '7.2 جم', stock: '3 فروع', price: '41,800', type: 'necklace', img: B + 'dbac027a2563d3d060bfab8971cfc70a' },
      { name: 'خاتم سوليتير', karat: 'عيار 18', weight: '2.8 جم', stock: '2 فرع', price: '14,900', type: 'ring', img: B + '40395988bc31fe64061dae2b8d49ae37' },
      { name: 'دبلة كلاسيك', karat: 'عيار 21', weight: '4.5 جم', stock: '3 فروع', price: '26,300', type: 'band', img: B + '6654292039d74cb5457e0d512560b7ec' },
      { name: 'إسورة مضفّرة', karat: 'عيار 21', weight: '10.5 جم', stock: 'فرع واحد', price: '60,900', type: 'bracelet', img: B + 'edccb29f110a4f2979286cee57c7fee2' },
      { name: 'حلق دلّاية', karat: 'عيار 18', weight: '3.6 جم', stock: '2 فرع', price: '19,100', type: 'earring', img: B + '4d5dfe9a3395aa599a07fc121050b575' },
      { name: 'طقم ناعم', karat: 'عيار 21', weight: '14 جم', stock: 'فرع واحد', price: '81,500', type: 'necklace', img: B + '6b2d4362523d3a759e7da3ef4b66ef99' },
      { name: 'خاتم فصوص', karat: 'عيار 18', weight: '3.4 جم', stock: '2 فرع', price: '17,600', type: 'ring', img: B + '6269e75cff1d3f5ab8c19492328da772' },
      { name: 'دبلة محفورة', karat: 'عيار 21', weight: '5.2 جم', stock: 'فرع واحد', price: '30,100', type: 'band', img: B + '85a0dc8ac6452dbc940941acd03fd4d2' }
    ].map((p) => Object.assign({}, p, { alt: p.name + ' ' + p.karat + ' (صورة توضيحية)' }));
    const cats = [
      { id: 'all', label: 'الكل' }, { id: 'ring', label: 'خواتم' }, { id: 'band', label: 'دبل' },
      { id: 'necklace', label: 'سلاسل وأطقم' }, { id: 'bracelet', label: 'أساور' }, { id: 'earring', label: 'حلقان' }
    ];
    const base = 'flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;';
    const items = this.state.cat === 'all' ? all : all.filter((p) => p.type === this.state.cat);
    return {
      cats: cats.map((c) => ({
        label: c.label,
        pick: () => this.setState({ cat: c.id }),
        style: base + (this.state.cat === c.id ? ' background: #12100C; color: #F6F3EE; border: 1px solid #12100C;' : ' background: #FFFFFF; color: #1A1712; border: 1px solid #E6DECF;')
      })),
      items,
      count: items.length
    };
  }
}
</script>
</body>
</html>
