<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التطبيق — المجوهرات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6A1F}a:hover{color:#5E4712}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F2EE; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1712; font-variant-numeric: tabular-nums">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto; padding: 20px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<h1 style="margin: 0; font-family: 'El Messiri', serif; font-size: 28px; font-weight: 700">مجوهرات الحياة</h1>

<div style="display: flex; gap: 10px">
<div style="flex: 1; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E4DFD6; border-radius: 14px; padding: 0 14px; min-height: 48px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E584E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="shop-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ابحث في المجوهرات</label>
<input id="shop-q" type="search" placeholder="ابحث: خاتم، سلسلة، دبلة…" style="flex: 1; border: none; outline: none; font: inherit; font-size: 15px; background: transparent; min-height: 44px; color: #1A1712">
</div>
<button type="button" aria-label="الفلاتر" style="width: 48px; height: 48px; border-radius: 14px; background: #12100C; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8A04B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
</div>

<button type="button" style="display: flex; align-items: center; gap: 8px; background: transparent; border: none; padding: 0; font: inherit; font-size: 14px; color: #1A1712; cursor: pointer; min-height: 44px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
<span>متوفر في: <b>كل الفروع</b></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1712" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>

<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3F3A31; background: #F1E6CC; border-radius: 12px; padding: 10px 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h12l-3-3"></path><path d="M17 17H5l3 3"></path></svg>
<span>ادفع كاش، أو من رصيد ذهبك في التطبيق</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="6">
<a href="AppProduct.dc.html" style="text-decoration: none; color: #1A1712; display: flex; flex-direction: column; gap: 6px">
<span style="height: 160px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative">
<sc-if value="{{p.ring}}" hint-placeholder-val="{{ false }}"><svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#B8913E" stroke-width="1.4" aria-hidden="true"><circle cx="32" cy="38" r="15"></circle><path d="M27 23l5-8 5 8-5 4z"></path></svg></sc-if>
<sc-if value="{{p.band}}" hint-placeholder-val="{{ false }}"><svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#B8913E" stroke-width="1.4" aria-hidden="true"><circle cx="26" cy="34" r="13"></circle><circle cx="38" cy="34" r="13"></circle></svg></sc-if>
<sc-if value="{{p.necklace}}" hint-placeholder-val="{{ true }}"><svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#B8913E" stroke-width="1.4" aria-hidden="true"><path d="M12 14c2 18 10 28 20 28s18-10 20-28"></path><path d="M32 42v4"></path><path d="M32 46l-5 6 5 6 5-6z"></path></svg></sc-if>
<sc-if value="{{p.bracelet}}" hint-placeholder-val="{{ false }}"><svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#B8913E" stroke-width="1.4" aria-hidden="true"><ellipse cx="32" cy="32" rx="22" ry="12"></ellipse><ellipse cx="32" cy="32" rx="17" ry="8"></ellipse></svg></sc-if>
<sc-if value="{{p.earring}}" hint-placeholder-val="{{ false }}"><svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#B8913E" stroke-width="1.4" aria-hidden="true"><path d="M22 12v8"></path><path d="M22 20c-6 8-6 16 0 20 6-4 6-12 0-20z"></path><path d="M42 12v8"></path><path d="M42 20c-6 8-6 16 0 20 6-4 6-12 0-20z"></path></svg></sc-if>
<sc-if value="{{p.coin}}" hint-placeholder-val="{{ false }}"><svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#B8913E" stroke-width="1.4" aria-hidden="true"><circle cx="32" cy="32" r="18"></circle><circle cx="32" cy="32" r="13"></circle></svg></sc-if>
<span style="position: absolute; top: 10px; inset-inline-start: 10px; font-size: 11px; font-weight: 700; color: #8A6A1F; background: #F4F2EE; border-radius: 999px; padding: 3px 8px">{{p.karat}}</span>
</span>
<b style="font-size: 14px">{{p.name}}</b>
<span style="font-size: 12px; color: #5E584E">{{p.weight}} · {{p.stock}}</span>
<b style="font-size: 15px; color: #8A6A1F">≈ {{p.price}} ج.م</b>
</a>
</sc-for>
</div>
</div>

<nav aria-label="التنقل الرئيسي" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E4DFD6; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
<a href="AppHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>الرئيسية</a>
<a href="AppShop.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #8A6A1F; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l3 6-9 12L3 9z"></path><path d="M3 9h18"></path></svg>المجوهرات</a>
<a href="AppBuy.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; text-decoration: none; color: #1A1712; font-size: 11px; font-weight: 700; margin-top: -26px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #C8A04B; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12100C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>اشترِ ذهب</a>
<a href="AppWallet.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>محفظتي</a>
<a href="AppBranches.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; min-height: 44px; text-decoration: none; color: #6B6458; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>الفروع</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all' };
  }
  renderVals() {
    const all = [
      { name: 'سلسلة مبرومة بدلاية', karat: 'عيار 21', weight: '7.2 جم', stock: '3 فروع', price: '41,800', type: 'necklace', necklace: true },
      { name: 'خاتم سوليتير', karat: 'عيار 18', weight: '2.8 جم', stock: '2 فرع', price: '14,900', type: 'ring', ring: true },
      { name: 'دبلة كلاسيك', karat: 'عيار 21', weight: '4.5 جم', stock: '3 فروع', price: '26,300', type: 'band', band: true },
      { name: 'إسورة مضفّرة', karat: 'عيار 21', weight: '10.5 جم', stock: 'فرع واحد', price: '60,900', type: 'bracelet', bracelet: true },
      { name: 'حلق دلّاية', karat: 'عيار 18', weight: '3.6 جم', stock: '2 فرع', price: '19,100', type: 'earring', earring: true },
      { name: 'جنيه ذهب', karat: 'عيار 21', weight: '8 جم', stock: 'كل الفروع', price: '44,300', type: 'coin', coin: true }
    ];
    const cats = [
      { id: 'all', label: 'الكل' }, { id: 'ring', label: 'خواتم' }, { id: 'band', label: 'دبل' },
      { id: 'necklace', label: 'سلاسل' }, { id: 'bracelet', label: 'أساور' }, { id: 'earring', label: 'حلقان' }, { id: 'coin', label: 'سبائك وعملات' }
    ];
    const base = 'flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;';
    return {
      cats: cats.map((c) => ({
        ...c,
        pick: () => this.setState({ cat: c.id }),
        style: base + (this.state.cat === c.id ? ' background: #12100C; color: #FFFFFF; border: 1px solid #12100C;' : ' background: #FFFFFF; color: #1A1712; border: 1px solid #E4DFD6;')
      })),
      items: this.state.cat === 'all' ? all : all.filter((p) => p.type === this.state.cat)
    };
  }
}
</script>
</body>
</html>
