<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التطبيق — خطة الادخار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6A1F}a:hover{color:#5E4712}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F2EE; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1712; font-variant-numeric: tabular-nums">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 96px; overflow-y: auto; padding: 16px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="AppWallet.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<b style="font-size: 18px">خطة ادخار شهرية</b>
<span style="width: 44px"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">بتدّخر ليه؟</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
<button type="button" onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">المبلغ كل شهر</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{amounts}}" as="a" hint-placeholder-count="4">
<button type="button" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">يوم الخصم من كل شهر</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="4">
<button type="button" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button>
</sc-for>
</div>
</div>

<div style="background: #12100C; color: #F4F2EE; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A39A88">لو السعر فضل زي النهارده، في سنة هيبقى عندك</span>
<b style="font-size: 36px; color: #C8A04B">≈ {{yearGrams}} جم</b>
<span style="font-size: 14px; color: #CFC6B4">عيار 24 · {{yearMoney}} ج.م على 12 شهر</span>
</div>

<div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px">
<span style="display: flex; flex-direction: column; gap: 2px"><b>الخصم من</b><span style="color: #5E584E">بطاقة •••• [آخر 4]</span></span>
<a href="#change" style="font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">تغيير</a>
</div>
<span style="font-size: 12px; color: #5E584E; line-height: 1.7">تقدر توقف الخطة أو تغيّر المبلغ في أي وقت. الحسبة تقريبية لأن سعر الذهب بيتغير.</span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #FFFFFF; border-top: 1px solid #E4DFD6; padding: 16px 20px; box-sizing: border-box">
<a href="AppWallet.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #12100C; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 17px">تفعيل الخطة</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { goal: 'wedding', amount: 2000, day: 1 };
  }
  renderVals() {
    const s = this.state;
    const fmt = (n) => Math.round(n).toLocaleString('en-US');
    const chip = 'min-height: 44px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 12px;';
    const on = ' background: #C8A04B; color: #12100C; border: 1px solid #C8A04B;';
    const off = ' background: #FFFFFF; color: #1A1712; border: 1px solid #E4DFD6;';
    return {
      goals: [{ id: 'wedding', label: 'جواز وشبكة' }, { id: 'kids', label: 'مستقبل الأولاد' }, { id: 'invest', label: 'استثمار' }, { id: 'gift', label: 'هدية' }]
        .map((g) => ({ label: g.label, pick: () => this.setState({ goal: g.id }), style: chip + (s.goal === g.id ? ' background: #12100C; color: #FFFFFF; border: 1px solid #12100C;' : off) })),
      amounts: [500, 1000, 2000, 5000].map((a) => ({ label: fmt(a), pick: () => this.setState({ amount: a }), style: chip + (s.amount === a ? on : off) })),
      days: [1, 5, 10, 25].map((d) => ({ label: 'يوم ' + d, pick: () => this.setState({ day: d }), style: chip + (s.day === d ? on : off) })),
      yearGrams: (s.amount * 12 / 6240).toFixed(2),
      yearMoney: fmt(s.amount * 12)
    };
  }
}
</script>
</body>
</html>
