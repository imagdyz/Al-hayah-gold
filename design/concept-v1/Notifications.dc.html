<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التطبيق — الإشعارات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6A1F}a:hover{color:#5E4712}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F2EE; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1712; font-variant-numeric: tabular-nums">
<div style="position: absolute; inset: 0; overflow-y: auto; padding: 16px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="AppHome.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<b style="font-size: 18px">الإشعارات</b>
<button type="button" style="min-height: 44px; border: none; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: #8A6A1F; cursor: pointer">قراءة الكل</button>
</div>

<div style="display: flex; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #5E584E; font-weight: 600; padding-top: 6px">{{g.title}}</span>
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; gap: 12px; text-decoration: none; color: #1A1712; align-items: flex-start">
<span style="{{n.iconBg}}">
<sc-if value="{{n.isPrice}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M9 7h8v8"></path></svg></sc-if>
<sc-if value="{{n.isOrder}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5"></path></svg></sc-if>
<sc-if value="{{n.isNew}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l3 6-9 12L3 9z"></path><path d="M3 9h18"></path></svg></sc-if>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between; gap: 8px"><b style="font-size: 15px">{{n.title}}</b><span style="font-size: 12px; color: #5E584E; white-space: nowrap">{{n.time}}</span></span><span style="font-size: 14px; line-height: 1.6; color: #3F3A31">{{n.body}}</span></span>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C8A04B; flex: none; margin-top: 6px" aria-label="غير مقروء"></span></sc-if>
</a>
</sc-for>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all' };
  }
  renderVals() {
    const t = this.state.tab;
    const icon = (kind) => 'width: 40px; height: 40px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; background: ' + ({ price: '#F1E6CC', order: '#E3F2E9', news: '#F4F2EE' }[kind]) + ';';
    const mk = (kind, title, body, time, unread, href) => ({ kind, title, body, time, unread, href, isPrice: kind === 'price', isOrder: kind === 'order', isNew: kind === 'news', iconBg: icon(kind) });
    const groups = [
      { title: 'النهارده', items: [
        mk('price', 'السعر وصل للي طلبته', 'عيار 21 بقى 5,460 ج.م للجرام. تحب تشتري دلوقتي؟', 'من 5 دقايق', true, 'Prices.dc.html'),
        mk('order', 'قطعتك جاهزة في الفرع', 'سلسلة مبرومة بدلاية مستنياك في فرع [١] لحد [التاريخ].', 'من ساعة', true, 'ReserveDone.dc.html'),
        mk('order', 'طلبك جاهز للاستلام', 'سبيكة 10 جم في فرع [١]. وري كود AH-2481 في الفرع.', '9 ص', false, 'AppOrders.dc.html')
      ] },
      { title: 'امبارح', items: [
        mk('news', 'وصل حديثاً', 'تشكيلة دبل جديدة عيار 21 في فرع [٢].', '7 م', false, 'AppShop.dc.html'),
        mk('order', 'معاد البيع اتأكد', 'مستنيينك بكرة 12 ظ في فرع [١] بذهبك القديم.', '2 ظ', false, 'AppOrders.dc.html')
      ] }
    ];
    const filter = (it) => t === 'all' || (t === 'price' && it.kind === 'price') || (t === 'orders' && it.kind === 'order');
    const base = 'min-height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;';
    return {
      tabs: [{ id: 'all', label: 'الكل' }, { id: 'price', label: 'الأسعار' }, { id: 'orders', label: 'عملياتي' }].map((x) => ({
        label: x.label, pick: () => this.setState({ tab: x.id }),
        style: base + (t === x.id ? ' background: #12100C; color: #FFFFFF; border: 1px solid #12100C;' : ' background: #FFFFFF; color: #1A1712; border: 1px solid #E4DFD6;')
      })),
      groups: groups.map((g) => ({ ...g, items: g.items.filter(filter) })).filter((g) => g.items.length)
    };
  }
}
</script>
</body>
</html>
